<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- NSM Grunnprinsipper kategorier — flyt mellom kategoriene -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
    <linearGradient id="gradIdent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d4f8b"/>
      <stop offset="100%" stop-color="#1565a3"/>
    </linearGradient>
    <linearGradient id="gradBeskytt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d6f3f"/>
      <stop offset="100%" stop-color="#2c8852"/>
    </linearGradient>
    <linearGradient id="gradOppdage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a85d00"/>
      <stop offset="100%" stop-color="#c97515"/>
    </linearGradient>
    <linearGradient id="gradHandtere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a1f1f"/>
      <stop offset="100%" stop-color="#a52a2a"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a1a">NSM Grunnprinsipper for IKT-sikkerhet v2.1</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#555">4 kategorier · 21 prinsipper · 118 tiltak</text>

  <!-- Kategori 1: Identifisere -->
  <g>
    <rect x="40" y="100" width="190" height="170" rx="8" fill="url(#gradIdent)"/>
    <text x="135" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="white">1. Identifisere</text>
    <text x="135" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="white">og kartlegge</text>
    <line x1="60" y1="160" x2="210" y2="160" stroke="white" stroke-opacity="0.4"/>
    <text x="60" y="180" font-size="11" fill="white">1.1 Styringsstrukturer</text>
    <text x="60" y="200" font-size="11" fill="white">1.2 Enheter og programvare</text>
    <text x="60" y="220" font-size="11" fill="white">1.3 Brukere og tilgang</text>
    <text x="135" y="252" text-anchor="middle" font-size="11" font-style="italic" fill="white" fill-opacity="0.85">3 prinsipper</text>
  </g>

  <!-- Kategori 2: Beskytte -->
  <g>
    <rect x="260" y="100" width="190" height="280" rx="8" fill="url(#gradBeskytt)"/>
    <text x="355" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="white">2. Beskytte og</text>
    <text x="355" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="white">opprettholde</text>
    <line x1="280" y1="160" x2="430" y2="160" stroke="white" stroke-opacity="0.4"/>
    <text x="280" y="180" font-size="10" fill="white">2.1 Anskaffelse/utvikling</text>
    <text x="280" y="197" font-size="10" fill="white">2.2 Sikker IKT-arkitektur</text>
    <text x="280" y="214" font-size="10" font-weight="600" fill="#fff8b3">2.3 Sikker konfigurasjon ★</text>
    <text x="280" y="231" font-size="10" font-weight="600" fill="#fff8b3">2.4 Beskytt nettverk ★</text>
    <text x="280" y="248" font-size="10" fill="white">2.5 Kontroller dataflyt</text>
    <text x="280" y="265" font-size="10" fill="white">2.6 Identitet og tilgang</text>
    <text x="280" y="282" font-size="10" fill="white">2.7 Data i ro/transitt</text>
    <text x="280" y="299" font-size="10" fill="white">2.8 E-post og nettleser</text>
    <text x="280" y="316" font-size="10" fill="white">2.9 Gjenoppretting av data</text>
    <text x="280" y="333" font-size="10" fill="white">2.10 Endringshåndtering</text>
    <text x="355" y="362" text-anchor="middle" font-size="11" font-style="italic" fill="white" fill-opacity="0.85">10 prinsipper</text>
  </g>

  <!-- Kategori 3: Oppdage -->
  <g>
    <rect x="480" y="100" width="190" height="200" rx="8" fill="url(#gradOppdage)"/>
    <text x="575" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="white">3. Oppdage</text>
    <line x1="500" y1="155" x2="650" y2="155" stroke="white" stroke-opacity="0.4"/>
    <text x="500" y="180" font-size="11" fill="white">3.1 Sårbarheter og trusler</text>
    <text x="500" y="200" font-size="11" font-weight="600" fill="#fff8b3">3.2 Sikkerhetsovervåkning ★</text>
    <text x="500" y="220" font-size="11" fill="white">3.3 Analyser overvåkning</text>
    <text x="500" y="240" font-size="11" fill="white">3.4 Inntrengningstester</text>
    <text x="575" y="278" text-anchor="middle" font-size="11" font-style="italic" fill="white" fill-opacity="0.85">4 prinsipper</text>
  </g>

  <!-- Kategori 4: Håndtere -->
  <g>
    <rect x="700" y="100" width="160" height="200" rx="8" fill="url(#gradHandtere)"/>
    <text x="780" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="white">4. Håndtere og</text>
    <text x="780" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="white">gjenopprette</text>
    <line x1="715" y1="160" x2="845" y2="160" stroke="white" stroke-opacity="0.4"/>
    <text x="715" y="182" font-size="10" fill="white">4.1 Forbered håndtering</text>
    <text x="715" y="202" font-size="10" fill="white">4.2 Vurder/klassifiser</text>
    <text x="715" y="222" font-size="10" fill="white">4.3 Kontroller/håndter</text>
    <text x="715" y="242" font-size="10" fill="white">4.4 Evaluer og lær</text>
    <text x="780" y="278" text-anchor="middle" font-size="11" font-style="italic" fill="white" fill-opacity="0.85">4 prinsipper</text>
  </g>

  <!-- Flow arrows -->
  <line x1="232" y1="185" x2="258" y2="185" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="452" y1="185" x2="478" y2="185" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="672" y1="185" x2="698" y2="185" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Continuous loop indicator -->
  <path d="M 780 305 Q 780 430 450 430 Q 135 430 135 280" stroke="#888" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="450" y="450" text-anchor="middle" font-size="11" font-style="italic" fill="#666">Kontinuerlig prosess gjennom IKT-systemets levetid</text>

  <!-- Legend for star -->
  <g transform="translate(40, 480)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#1a1a1a">★ = Dekket av dybde-lab i denne mappen</text>
  </g>

  <!-- Source -->
  <text x="860" y="500" text-anchor="end" font-size="9" fill="#999">Kilde: nsm.no/regelverk-og-hjelp/rad-og-anbefalinger/ (v2.1, juni 2024)</text>
</svg>
