# ============================================================================
# 10-crypto.conf — Cryptographic primitives
# ============================================================================
#
# Philosophy: only modern, AEAD ciphers; only ETM (Encrypt-then-MAC) MACs;
# only Curve25519 or post-quantum KEX. Everything else is removed, not just
# de-prioritized, so a downgrade attack cannot succeed.
#
# References:
#   - Mozilla OpenSSH guidelines (Modern profile)
#     https://infosec.mozilla.org/guidelines/openssh
#   - ssh-audit hardening guide
#     https://github.com/jtesta/ssh-audit/blob/master/README.md
#   - draft-ietf-sshm-ssh-pq (post-quantum KEX in SSH)
# ============================================================================


# ----------------------------------------------------------------------------
# Host keys — server identifies itself to clients with these
# ----------------------------------------------------------------------------
# Use Ed25519 only. RSA-4096 retained ONLY for clients that genuinely cannot
# do Ed25519 (very old embedded systems). On homelab/cloud, you can usually
# remove the RSA host key entirely — but verify your clients first.
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key

# Do NOT include ECDSA host key — NIST P-curves have a complicated history
# (Dual_EC_DRBG legacy, nothing-up-my-sleeve concerns) and Ed25519 is faster
# and at least as secure.
# Remove it if present:  rm /etc/ssh/ssh_host_ecdsa_key*


# ----------------------------------------------------------------------------
# Key Exchange (KEX) — how we agree on a session key
# ----------------------------------------------------------------------------
# Order matters: client proposes, server picks first match from this list.
# sntrup761x25519-sha512 is post-quantum hybrid — defends against
# "store now, decrypt later" attacks. Requires OpenSSH 9.0+.
#
# Curve25519-sha256 is the modern default. Both libssh and openssh names
# included for compatibility.
#
# REMOVED from this list (and why):
#   diffie-hellman-group-exchange-sha256       — DH, slower, more complex
#   diffie-hellman-group16-sha512              — DH, slower
#   diffie-hellman-group14-sha256              — DH-2048, marginal in 2026
#   diffie-hellman-group14-sha1                — SHA-1, broken
#   diffie-hellman-group1-sha1                 — DH-1024, broken
#   ecdh-sha2-nistp256/384/521                 — NIST curves, see above
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org


# ----------------------------------------------------------------------------
# Symmetric ciphers — the actual data encryption
# ----------------------------------------------------------------------------
# AEAD only. ChaCha20-Poly1305 first because it's faster on CPUs without
# AES-NI (and on AArch64 without crypto extensions, which includes some
# Raspberry Pi homelab nodes).
#
# REMOVED:
#   aes256-cbc / aes128-cbc          — CBC mode, padding-oracle history
#   3des-cbc                         — 3DES, broken
#   aes256-ctr / aes128-ctr / etc.   — CTR is fine cryptographically but lacks
#                                      built-in integrity, prefer GCM
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com


# ----------------------------------------------------------------------------
# MAC algorithms — only relevant if cipher isn't AEAD
# ----------------------------------------------------------------------------
# When using ChaCha20-Poly1305 or AES-GCM, the MAC is built in and this list
# isn't used. But for defense-in-depth in case of a fallback, only ETM SHA-2
# variants are allowed.
#
# ETM = Encrypt-then-MAC, prevents the original SSH MAC-then-Encrypt issue.
#
# REMOVED:
#   hmac-md5*                  — MD5, broken
#   hmac-sha1*                 — SHA-1, deprecated
#   *-etm@openssh.com without sha-2  — variants on broken hashes
#   hmac-sha2-256 (without -etm)     — non-ETM, structurally weaker
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com


# ----------------------------------------------------------------------------
# Allowed signature algorithms for client public keys
# ----------------------------------------------------------------------------
# Restrict what algorithms a CLIENT can present a key with.
# Ed25519 (incl. FIDO2 sk-* variants) preferred. RSA only with SHA-2.
#
# REMOVED:
#   ssh-rsa            — defaults to SHA-1 signatures, deprecated since OpenSSH 8.8
#   ssh-dss            — DSA, broken
#   ecdsa-sha2-*       — see HostKey notes above
PubkeyAcceptedAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256,rsa-sha2-256-cert-v01@openssh.com


# Same restriction applied to host keys the server will accept from peers
# during host-based authentication (which we disable, but defense-in-depth):
HostbasedAcceptedAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com,rsa-sha2-512,rsa-sha2-256


# Match restrictions for user CA-signed certificates
CASignatureAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com,rsa-sha2-512,rsa-sha2-256
