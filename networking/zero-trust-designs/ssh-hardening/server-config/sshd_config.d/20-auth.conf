# ============================================================================
# 20-auth.conf — Authentication policy
# ============================================================================


# ----------------------------------------------------------------------------
# Authentication methods
# ----------------------------------------------------------------------------
# Public key only. Period.
PubkeyAuthentication yes

# Password auth: off. If you forget your key, you go to the console.
# That's a feature, not a bug — it means brute force attacks are impossible
# at the SSH layer.
PasswordAuthentication no
PermitEmptyPasswords no

# Keyboard-interactive: off. This is the modern attack vector when password
# auth is disabled — some PAM modules expose challenge-response that can
# fall back to passwords.
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

# Host-based auth: off. Trust between hosts is fragile and we don't need it.
HostbasedAuthentication no
IgnoreUserKnownHosts yes
IgnoreRhosts yes

# GSSAPI / Kerberos: off unless you actively use it. Most homelabs and small
# cloud setups don't, and it's an extra attack surface.
GSSAPIAuthentication no
KerberosAuthentication no

# PAM: required for system integration (logging, session limits, etc.)
# but PAM cannot do password auth here because PasswordAuthentication=no.
UsePAM yes


# ----------------------------------------------------------------------------
# Authentication chaining (for FIDO2 + cert use cases)
# ----------------------------------------------------------------------------
# Default: just publickey is enough. For high-value hosts, require
# both a publickey AND something else (like a CA-signed certificate).
# Uncomment and adjust per host as needed:
#
# AuthenticationMethods publickey,publickey
#   ^ requires TWO different public keys to succeed (e.g. user key + admin key)
#
# AuthenticationMethods publickey
#   ^ standard: just one public key (default behavior)


# ----------------------------------------------------------------------------
# Root and user policy
# ----------------------------------------------------------------------------
# Root login: no. Always sudo from a named user account so audit trails
# show WHO, not just "root".
PermitRootLogin no

# Restrict who can SSH in. Match by group is more maintainable than by user.
# Create the group: groupadd ssh-users; usermod -aG ssh-users sasha
AllowGroups ssh-users

# Login attempts before disconnect
MaxAuthTries 3

# Time window for the user to authenticate
LoginGraceTime 30s

# Allow only known users (defense-in-depth alongside AllowGroups)
DenyUsers root admin guest test


# ----------------------------------------------------------------------------
# AuthorizedKeys handling
# ----------------------------------------------------------------------------
# Default location is ~/.ssh/authorized_keys per user.
# StrictModes: refuse to use authorized_keys if permissions are too open.
StrictModes yes
AuthorizedKeysFile .ssh/authorized_keys

# Don't allow users to configure environment via ~/.ssh/environment.
# This was historically a privilege escalation path on misconfigured systems.
PermitUserEnvironment no
