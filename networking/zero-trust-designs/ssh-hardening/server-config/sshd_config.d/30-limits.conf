# ============================================================================
# 30-limits.conf — Session limits, forwarding, and rate limiting
# ============================================================================


# ----------------------------------------------------------------------------
# Forwarding — defense against lateral movement
# ----------------------------------------------------------------------------
# Agent forwarding: NEVER. If you SSH from your laptop to host A with agent
# forwarding, and A is compromised, the attacker can use your agent to
# authenticate as you to any other host you have keys for. ProxyJump solves
# the legitimate use cases (jumping through bastions) without this risk.
AllowAgentForwarding no

# X11 forwarding: off. We don't run GUI applications over SSH on these hosts,
# and X11 forwarding has its own attack surface.
X11Forwarding no

# TCP forwarding: off by default. Enable per-host where you actually need
# port forwarding (e.g. tunneling kubectl through bastion).
# Override with: AllowTcpForwarding yes  in a Match block per use case.
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no


# ----------------------------------------------------------------------------
# Connection limits
# ----------------------------------------------------------------------------
# Max concurrent unauthenticated connections from a single source.
# Format: start:rate:full
#   start = number of unauthenticated connections allowed before rate-limiting
#   rate  = percentage chance of a new connection being dropped (random)
#   full  = number of connections at which all new are refused
# 10:30:60 means: first 10 are accepted, then ramp up drop probability,
# total cap at 60.
MaxStartups 10:30:60

# Max sessions per connection (channels multiplexed on one TCP)
MaxSessions 4

# Idle session timeout: disconnect after 10 min of inactivity
ClientAliveInterval 300
ClientAliveCountMax 2
# 300s * (2+1) = 15 min total before kicking idle session


# ----------------------------------------------------------------------------
# Compression
# ----------------------------------------------------------------------------
# Off. Compression has historically had attack surface (CRIME-style attacks
# don't apply directly but the principle stands), and it adds CPU cost for
# minimal bandwidth saving on already-encrypted streams.
Compression no


# ----------------------------------------------------------------------------
# UseDNS
# ----------------------------------------------------------------------------
# Off. DNS lookups for client hostnames slow login and don't add security
# (you should be using AllowGroups/keys, not hostname-based ACL).
UseDNS no


# ----------------------------------------------------------------------------
# DebianBanner / version disclosure
# ----------------------------------------------------------------------------
# Don't broadcast that this is "OpenSSH_9.6p1 Ubuntu-3ubuntu13" in the
# initial banner — gives attackers free recon. Note: this is a Debian/Ubuntu
# specific option, ignored on RHEL/SUSE.
DebianBanner no
