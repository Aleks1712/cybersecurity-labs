# ============================================================================
# 40-audit.conf — Logging and audit trail
# ============================================================================


# ----------------------------------------------------------------------------
# Logging level
# ----------------------------------------------------------------------------
# VERBOSE logs key fingerprints used for successful auths — this is critical
# for audit. INFO is the default and does NOT log fingerprints, so you cannot
# answer "which key was used to log in?" from journalctl alone.
LogLevel VERBOSE


# ----------------------------------------------------------------------------
# SyslogFacility
# ----------------------------------------------------------------------------
# AUTH (default) ships to /var/log/auth.log on Debian/Ubuntu, /var/log/secure
# on RHEL/SUSE. Both are typically picked up by journald and forwarded.
SyslogFacility AUTH


# ----------------------------------------------------------------------------
# Print last login info to user on connect
# ----------------------------------------------------------------------------
# Useful for the user to spot anomalies ("when did I last log in?").
PrintLastLog yes
PrintMotd no


# ----------------------------------------------------------------------------
# Notes on log shipping (not configured here, but document it)
# ----------------------------------------------------------------------------
# This config alone does not ship logs anywhere. For real audit:
#
# 1. Configure systemd-journal-upload OR rsyslog to forward auth.log to a
#    central collector (Loki, Sentinel via AMA, Splunk UF).
#
# 2. Add auditd rules to detect TAMPERING with the SSH config itself:
#
#    /etc/audit/rules.d/sshd.rules:
#    -w /etc/ssh/sshd_config -p wa -k sshd_config_change
#    -w /etc/ssh/sshd_config.d/ -p wa -k sshd_config_change
#    -w /etc/ssh/ssh_host_ed25519_key -p wa -k sshd_hostkey_change
#    -w /root/.ssh/authorized_keys -p wa -k root_authkeys_change
#    -w /home -p wa -k home_authkeys_change
#
#    Then: augenrules --load && systemctl restart auditd
#
# 3. Sigma rule for SSH brute force / anomaly is in
#    cybersec/sigma-rules/ssh-anomaly.yml (cross-reference)
